<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renata Faria - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Renata Faria</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Português</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1></h1>
            <p></p>
        </div>
    </section>

    <div class="container">
        <section class="section" id="about">
            <h2>Who am I?</h2>
            <p></p>
        </section>

        <section class="section" id="education">
            <h2>Education</h2>
            <div class="row">
                <!-- Cards serão inseridos aqui -->
            </div>
        </section>

        <section class="section" id="projects">
            <h2>Projects & Awards & Events</h2>
            <div class="row">
                <!-- Cards serão inseridos aqui -->
            </div>
        </section>

        <section class="section" id="testimonials">
            <h2>What they say about me?</h2>
            <!-- Quotes serão inseridos aqui -->
        </section>

        <section class="section" id="courses">
            <h2>Courses</h2>
            <div class="row">
                <!-- Cards serão inseridos aqui -->
            </div>
        </section>
    </div>

    <footer class="bg-light text-center py-4">
        <div class="container">
            <p></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Controller para EN
        document.addEventListener('DOMContentLoaded', () => {
            fetch('../models/profile_en.json')
                .then(response => response.json())
                .then(data => {
                    // Mesmo código do app.js, mas ajustado para EN
                    document.querySelector('.hero h1').textContent = data.name;
                    document.querySelector('.hero p').textContent = data.title;
                    document.querySelector('#about p').textContent = data.about;

                    const educationContainer = document.querySelector('#education .row');
                    data.education.forEach(item => {
                        const card = `
                            <div class="col-md-4">
                                <div class="card">
                                    <img src="${item.image}" class="card-img-top" alt="${item.title}">
                                    <div class="card-body">
                                        <h5>${item.title}</h5>
                                        <p>${item.description}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        educationContainer.insertAdjacentHTML('beforeend', card);
                    });

                    const projectsContainer = document.querySelector('#projects .row');
                    data.projects.forEach(item => {
                        const card = `
                            <div class="col-md-4">
                                <div class="card">
                                    <img src="${item.image}" class="card-img-top" alt="${item.title}">
                                    <div class="card-body">
                                        <h5>${item.title}</h5>
                                        <p>${item.description}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        projectsContainer.insertAdjacentHTML('beforeend', card);
                    });

                    const testimonialsContainer = document.querySelector('#testimonials');
                    data.testimonials.forEach(item => {
                        const quote = `
                            <blockquote class="blockquote">
                                <p>"${item.text}"</p>
                                <footer class="blockquote-footer">${item.author} <cite title="Source Title">${item.source}</cite></footer>
                            </blockquote>
                        `;
                        testimonialsContainer.insertAdjacentHTML('beforeend', quote);
                    });

                    const coursesContainer = document.querySelector('#courses .row');
                    data.courses.forEach(item => {
                        const card = `
                            <div class="col-md-6">
                                <div class="card">
                                    <img src="${item.image}" class="card-img-top" alt="${item.title}">
                                    <div class="card-body">
                                        <h5>${item.title}</h5>
                                        <p>${item.description}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        coursesContainer.insertAdjacentHTML('beforeend', card);
                    });

                    const footer = document.querySelector('footer .container p');
                    footer.innerHTML = `Send me an email: <a href="mailto:${data.contact.email}">${data.contact.email}</a><br>
                    <a href="${data.contact.linkedin}" class="me-3">LinkedIn</a>
                    <a href="${data.contact.medium}">Medium</a>`;
                })
                .catch(error => console.error('Erro ao carregar dados:', error));
        });
    </script>
</body>
</html>
